---
layout: default
title: Blog Archive
permalink: /blog/archive/
---
<section class="archive shell h-feed">
  <header class="archive-header"><p class="label">Archive</p><h1 class="p-name">Every NABPR story</h1><p class="lede">{{ collections.posts | size }} entries, newest first.</p></header>
  <div class="archive-list archive-list--compact">
    {% for post in collections.posts %}<article class="archive-row h-entry"><time class="dt-published" datetime="{{ post.date | date_iso }}">{{ post.date | date_iso | slice: 0, 10 }}</time><h2><a class="u-url p-name" href="{{ post.url }}">{{ post.data.title }}</a></h2></article>{% endfor %}
  </div>
</section>
